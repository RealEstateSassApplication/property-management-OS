services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_os}
      POSTGRES_USER: ${POSTGRES_USER:-property_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-property_os}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-property_os} -d ${POSTGRES_DB:-property_os}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
