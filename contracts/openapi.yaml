openapi: 3.1.0
info:
  title: Property Management OS API
  version: 0.6.0
  description: |
    Contract for the Property Management OS modular-monolith backend.
    Production business requests use an OIDC Bearer JWT plus X-Organization-ID.
    The JWT resolves to a stable internal user and PostgreSQL organization membership/RBAC
    remains authoritative. Development/test may use X-User-ID when no Bearer token is supplied.
    Monetary values are integer minor units and financial/operational state is server-authoritative.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - OIDCBearer: []

tags:
  - { name: Portfolio }
  - { name: People }
  - { name: Leasing }
  - { name: Owners }
  - { name: Rent }
  - { name: Maintenance }

paths:
  /healthz:
    get:
      security: []
      operationId: getHealth
      responses:
        '200': { description: Healthy, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }

  /api/v1:
    get:
      security: []
      operationId: getApiInfo
      responses:
        '200': { description: API metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ApiInfo' } } } }

  /api/v1/properties:
    parameters: &businessIdentity
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
    get:
      tags: [Portfolio]
      operationId: listProperties
      responses: { '200': { $ref: '#/components/responses/PropertyList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Portfolio]
      operationId: createProperty
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/PropertyItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v1/properties/{propertyID}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/PropertyID' }
    get:
      tags: [Portfolio]
      operationId: getProperty
      responses: { '200': { $ref: '#/components/responses/PropertyItem' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Portfolio]
      operationId: updateProperty
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/PropertyItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v1/properties/{propertyID}/units:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/PropertyID' }
    get:
      tags: [Portfolio]
      operationId: listUnitsByProperty
      responses: { '200': { $ref: '#/components/responses/UnitList' } }
    post:
      tags: [Portfolio]
      operationId: createUnit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/UnitItem' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/v1/units/{unitID}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/UnitID' }
    get:
      tags: [Portfolio]
      operationId: getUnit
      responses: { '200': { $ref: '#/components/responses/UnitItem' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Portfolio]
      operationId: updateUnit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/UnitItem' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/v1/tenants:
    parameters: *businessIdentity
    get:
      tags: [People]
      operationId: listTenants
      responses: { '200': { $ref: '#/components/responses/TenantList' } }
    post:
      tags: [People]
      operationId: createTenant
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/TenantItem' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/v1/tenants/{tenantID}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/TenantID' }
    get:
      tags: [People]
      operationId: getTenant
      responses: { '200': { $ref: '#/components/responses/TenantItem' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [People]
      operationId: updateTenant
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/TenantItem' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/v1/tenancies:
    parameters: *businessIdentity
    get:
      tags: [Leasing]
      operationId: listTenancies
      responses: { '200': { $ref: '#/components/responses/TenancyList' } }
    post:
      tags: [Leasing]
      operationId: createTenancy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/TenancyItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/tenancies/{tenancyID}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/TenancyID' }
    get:
      tags: [Leasing]
      operationId: getTenancy
      responses: { '200': { $ref: '#/components/responses/TenancyItem' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Leasing]
      operationId: updateTenancy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/TenancyItem' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/leases:
    parameters: *businessIdentity
    get:
      tags: [Leasing]
      operationId: listLeases
      responses: { '200': { $ref: '#/components/responses/LeaseList' } }
    post:
      tags: [Leasing]
      operationId: createLease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/LeaseItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/leases/{leaseID}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/LeaseID' }
    get:
      tags: [Leasing]
      operationId: getLease
      responses: { '200': { $ref: '#/components/responses/LeaseItem' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Leasing]
      operationId: updateLease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/LeaseItem' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/owners:
    parameters: *businessIdentity
    get:
      tags: [Owners]
      operationId: listOwners
      responses: { '200': { $ref: '#/components/responses/OwnerList' } }
    post:
      tags: [Owners]
      operationId: createOwner
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/OwnerItem' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/v1/owners/{ownerID}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/OwnerID' }
    get:
      tags: [Owners]
      operationId: getOwner
      responses: { '200': { $ref: '#/components/responses/OwnerItem' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v1/ownership-interests:
    parameters: *businessIdentity
    get:
      tags: [Owners]
      operationId: listOwnershipInterests
      responses: { '200': { $ref: '#/components/responses/OwnershipInterestList' } }
    post:
      tags: [Owners]
      operationId: createOwnershipInterest
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipInterestCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/OwnershipInterestItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/rent/obligations:
    parameters: *businessIdentity
    get:
      tags: [Rent]
      operationId: listRentObligations
      responses: { '200': { $ref: '#/components/responses/RentObligationList' } }
    post:
      tags: [Rent]
      operationId: createRentObligation
      description: Amount, currency, and due date are derived server-side from the active lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RentObligationCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/RentObligationItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/rent/payments:
    parameters: *businessIdentity
    get:
      tags: [Rent]
      operationId: listRentPayments
      responses: { '200': { $ref: '#/components/responses/RentPaymentList' } }
    post:
      tags: [Rent]
      operationId: createRentPayment
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RentPaymentCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/RentPaymentItem' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/v1/rent/allocations:
    parameters: *businessIdentity
    post:
      tags: [Rent]
      operationId: createRentAllocation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RentAllocationCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/RentAllocationItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/maintenance/vendors:
    parameters: *businessIdentity
    get:
      tags: [Maintenance]
      operationId: listMaintenanceVendors
      responses: { '200': { $ref: '#/components/responses/VendorList' } }
    post:
      tags: [Maintenance]
      operationId: createMaintenanceVendor
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VendorCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/VendorItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' } }

  /api/v1/maintenance/requests:
    parameters: *businessIdentity
    get:
      tags: [Maintenance]
      operationId: listMaintenanceRequests
      responses: { '200': { $ref: '#/components/responses/MaintenanceRequestList' } }
    post:
      tags: [Maintenance]
      operationId: createMaintenanceRequest
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceRequestCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/MaintenanceRequestItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/v1/maintenance/requests/{requestID}/status:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/RequestID' }
    patch:
      tags: [Maintenance]
      operationId: updateMaintenanceRequestStatus
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceRequestStatusUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/MaintenanceRequestItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/maintenance/work-orders:
    parameters: *businessIdentity
    get:
      tags: [Maintenance]
      operationId: listWorkOrders
      responses: { '200': { $ref: '#/components/responses/WorkOrderList' } }
    post:
      tags: [Maintenance]
      operationId: createWorkOrder
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/WorkOrderItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/maintenance/work-orders/{workOrderID}/status:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/WorkOrderID' }
    patch:
      tags: [Maintenance]
      operationId: updateWorkOrderStatus
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderStatusUpdate' } } } }
      responses: { '200': { $ref: '#/components/responses/WorkOrderItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/maintenance/quotes:
    parameters: *businessIdentity
    get:
      tags: [Maintenance]
      operationId: listMaintenanceQuotes
      responses: { '200': { $ref: '#/components/responses/MaintenanceQuoteList' } }
    post:
      tags: [Maintenance]
      operationId: createMaintenanceQuote
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceQuoteCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/MaintenanceQuoteItem' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/v1/maintenance/quotes/{quoteID}/decision:
    parameters:
      - { $ref: '#/components/parameters/OrganizationScope' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/QuoteID' }
    post:
      tags: [Maintenance]
      operationId: decideMaintenanceQuote
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceQuoteDecision' } } } }
      responses: { '200': { $ref: '#/components/responses/MaintenanceQuoteItem' }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/maintenance/evidence:
    parameters: *businessIdentity
    get:
      tags: [Maintenance]
      operationId: listMaintenanceEvidence
      responses: { '200': { $ref: '#/components/responses/MaintenanceEvidenceList' } }
    post:
      tags: [Maintenance]
      operationId: createMaintenanceEvidence
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceEvidenceCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/MaintenanceEvidenceItem' }, '400': { $ref: '#/components/responses/BadRequest' } }

components:
  securitySchemes:
    OIDCBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC JWT verified against configured issuer discovery/JWKS and audience.

  parameters:
    OrganizationScope:
      name: X-Organization-ID
      in: header
      required: true
      description: Requested organization UUID. Membership and route permission are verified server-side.
      schema: { type: string, format: uuid }
    DevelopmentUser:
      name: X-User-ID
      in: header
      required: false
      description: Development/test-only internal user fallback when no Bearer token is supplied.
      schema: { type: string, format: uuid }
    PropertyID: { name: propertyID, in: path, required: true, schema: { type: string, format: uuid } }
    UnitID: { name: unitID, in: path, required: true, schema: { type: string, format: uuid } }
    TenantID: { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
    TenancyID: { name: tenancyID, in: path, required: true, schema: { type: string, format: uuid } }
    LeaseID: { name: leaseID, in: path, required: true, schema: { type: string, format: uuid } }
    OwnerID: { name: ownerID, in: path, required: true, schema: { type: string, format: uuid } }
    RequestID: { name: requestID, in: path, required: true, schema: { type: string, format: uuid } }
    WorkOrderID: { name: workOrderID, in: path, required: true, schema: { type: string, format: uuid } }
    QuoteID: { name: quoteID, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    BadRequest: &problem { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ProblemEnvelope' } } } }
    Unauthorized: { <<: *problem, description: Authentication required or token invalid }
    Forbidden: { <<: *problem, description: Identity not linked, membership missing, or permission denied }
    NotFound: { <<: *problem, description: Resource not found in organization scope }
    Conflict: { <<: *problem, description: Lifecycle, uniqueness, ownership, or balance conflict }
    PropertyItem: { description: Property, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyEnvelope' } } } }
    PropertyList: { description: Properties, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyListEnvelope' } } } }
    UnitItem: { description: Unit, content: { application/json: { schema: { $ref: '#/components/schemas/UnitEnvelope' } } } }
    UnitList: { description: Units, content: { application/json: { schema: { $ref: '#/components/schemas/UnitListEnvelope' } } } }
    TenantItem: { description: Tenant, content: { application/json: { schema: { $ref: '#/components/schemas/TenantEnvelope' } } } }
    TenantList: { description: Tenants, content: { application/json: { schema: { $ref: '#/components/schemas/TenantListEnvelope' } } } }
    TenancyItem: { description: Tenancy, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyEnvelope' } } } }
    TenancyList: { description: Tenancies, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyListEnvelope' } } } }
    LeaseItem: { description: Lease, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseEnvelope' } } } }
    LeaseList: { description: Leases, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseListEnvelope' } } } }
    OwnerItem: { description: Owner, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerEnvelope' } } } }
    OwnerList: { description: Owners, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerListEnvelope' } } } }
    OwnershipInterestItem: { description: Ownership interest, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipInterestEnvelope' } } } }
    OwnershipInterestList: { description: Ownership interests, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipInterestListEnvelope' } } } }
    RentObligationItem: { description: Rent obligation, content: { application/json: { schema: { $ref: '#/components/schemas/RentObligationEnvelope' } } } }
    RentObligationList: { description: Rent obligations, content: { application/json: { schema: { $ref: '#/components/schemas/RentObligationListEnvelope' } } } }
    RentPaymentItem: { description: Rent payment, content: { application/json: { schema: { $ref: '#/components/schemas/RentPaymentEnvelope' } } } }
    RentPaymentList: { description: Rent payments, content: { application/json: { schema: { $ref: '#/components/schemas/RentPaymentListEnvelope' } } } }
    RentAllocationItem: { description: Rent allocation, content: { application/json: { schema: { $ref: '#/components/schemas/RentAllocationEnvelope' } } } }
    VendorItem: { description: Vendor, content: { application/json: { schema: { $ref: '#/components/schemas/VendorEnvelope' } } } }
    VendorList: { description: Vendors, content: { application/json: { schema: { $ref: '#/components/schemas/VendorListEnvelope' } } } }
    MaintenanceRequestItem: { description: Maintenance request, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceRequestEnvelope' } } } }
    MaintenanceRequestList: { description: Maintenance requests, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceRequestListEnvelope' } } } }
    WorkOrderItem: { description: Work order, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderEnvelope' } } } }
    WorkOrderList: { description: Work orders, content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderListEnvelope' } } } }
    MaintenanceQuoteItem: { description: Maintenance quote, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceQuoteEnvelope' } } } }
    MaintenanceQuoteList: { description: Maintenance quotes, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceQuoteListEnvelope' } } } }
    MaintenanceEvidenceItem: { description: Maintenance evidence, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceEvidenceEnvelope' } } } }
    MaintenanceEvidenceList: { description: Maintenance evidence, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceEvidenceListEnvelope' } } } }

  schemas:
    HealthResponse: { type: object, required: [status, service, timestamp], properties: { status: { type: string }, service: { type: string }, timestamp: { type: string, format: date-time } } }
    ApiInfo: { type: object, required: [name, version], properties: { name: { type: string }, version: { type: string } } }
    ProblemEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }

    Property:
      type: object
      required: [id, organizationId, name, propertyType, addressLine1, city, countryCode, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        referenceCode: { type: string }
        name: { type: string }
        propertyType: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        countryCode: { type: string }
        status: { type: string, enum: [active, inactive, archived] }
        externalAvaraPropertyId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PropertyCreate: { type: object, required: [name, propertyType, addressLine1, city, countryCode], additionalProperties: true }
    PropertyUpdate: { type: object, additionalProperties: true }

    Unit:
      type: object
      required: [id, organizationId, propertyId, referenceCode, label, occupancyStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        referenceCode: { type: string }
        label: { type: string }
        bedrooms: { type: number }
        bathrooms: { type: number }
        floorArea: { type: number }
        floorAreaUnit: { type: string, enum: [sqft, sqm] }
        occupancyStatus: { type: string, enum: [vacant, occupied, reserved, unavailable] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UnitCreate: { type: object, required: [referenceCode, label], additionalProperties: true }
    UnitUpdate: { type: object, additionalProperties: true }

    Tenant:
      type: object
      required: [id, organizationId, legalName, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        legalName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [prospect, active, former, blocked] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
