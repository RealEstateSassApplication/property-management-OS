openapi: 3.1.0
info:
  title: Property Management OS API
  version: 0.4.0
  description: |
    Contract for the Property Management OS modular-monolith backend.
    Business endpoints require authenticated organization membership and route-level permission checks.
    During local development only, X-Organization-ID and X-User-ID inject identity before PostgreSQL membership/RBAC verification.
    Monetary values are integer minor units and financial balances are server-authoritative.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service liveness
      responses:
        '200': { description: API is healthy, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } } }

  /api/v1:
    get:
      operationId: getApiInfo
      summary: API metadata
      responses:
        '200': { description: API metadata, content: { application/json: { schema: { $ref: '#/components/schemas/ApiInfo' } } } }

  /api/v1/properties:
    parameters: &identity
      - { $ref: '#/components/parameters/DevelopmentOrganization' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
    get:
      operationId: listProperties
      summary: List organization properties
      responses:
        '200': { $ref: '#/components/responses/PropertyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createProperty
      summary: Create a property
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/PropertyItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/properties/{propertyID}:
    parameters:
      - { $ref: '#/components/parameters/DevelopmentOrganization' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/PropertyID' }
    get:
      operationId: getProperty
      summary: Get a property
      responses:
        '200': { $ref: '#/components/responses/PropertyItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProperty
      summary: Update a property
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyUpdate' } } } }
      responses:
        '200': { $ref: '#/components/responses/PropertyItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/properties/{propertyID}/units:
    parameters:
      - { $ref: '#/components/parameters/DevelopmentOrganization' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/PropertyID' }
    get:
      operationId: listUnitsByProperty
      summary: List units for a property
      responses:
        '200': { $ref: '#/components/responses/UnitList' }
    post:
      operationId: createUnit
      summary: Create a unit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/UnitItem' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/units/{unitID}:
    parameters:
      - { $ref: '#/components/parameters/DevelopmentOrganization' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/UnitID' }
    get:
      operationId: getUnit
      responses:
        '200': { $ref: '#/components/responses/UnitItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateUnit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitUpdate' } } } }
      responses:
        '200': { $ref: '#/components/responses/UnitItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tenants:
    parameters: *identity
    get:
      operationId: listTenants
      responses:
        '200': { $ref: '#/components/responses/TenantList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTenant
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/TenantItem' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/tenants/{tenantID}:
    parameters:
      - { $ref: '#/components/parameters/DevelopmentOrganization' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/TenantID' }
    get:
      operationId: getTenant
      responses:
        '200': { $ref: '#/components/responses/TenantItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTenant
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantUpdate' } } } }
      responses:
        '200': { $ref: '#/components/responses/TenantItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tenancies:
    parameters: *identity
    get:
      operationId: listTenancies
      responses:
        '200': { $ref: '#/components/responses/TenancyList' }
    post:
      operationId: createTenancy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/TenancyItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/tenancies/{tenancyID}:
    parameters:
      - { $ref: '#/components/parameters/DevelopmentOrganization' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/TenancyID' }
    get:
      operationId: getTenancy
      responses:
        '200': { $ref: '#/components/responses/TenancyItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTenancy
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyUpdate' } } } }
      responses:
        '200': { $ref: '#/components/responses/TenancyItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/leases:
    parameters: *identity
    get:
      operationId: listLeases
      responses:
        '200': { $ref: '#/components/responses/LeaseList' }
    post:
      operationId: createLease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/LeaseItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/leases/{leaseID}:
    parameters:
      - { $ref: '#/components/parameters/DevelopmentOrganization' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/LeaseID' }
    get:
      operationId: getLease
      responses:
        '200': { $ref: '#/components/responses/LeaseItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateLease
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseUpdate' } } } }
      responses:
        '200': { $ref: '#/components/responses/LeaseItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/owners:
    parameters: *identity
    get:
      operationId: listOwners
      summary: List property owners
      responses:
        '200': { $ref: '#/components/responses/OwnerList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOwner
      summary: Create an owner business record
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/OwnerItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/owners/{ownerID}:
    parameters:
      - { $ref: '#/components/parameters/DevelopmentOrganization' }
      - { $ref: '#/components/parameters/DevelopmentUser' }
      - { $ref: '#/components/parameters/OwnerID' }
    get:
      operationId: getOwner
      responses:
        '200': { $ref: '#/components/responses/OwnerItem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ownership-interests:
    parameters: *identity
    get:
      operationId: listOwnershipInterests
      summary: List effective property ownership interests
      responses:
        '200': { $ref: '#/components/responses/OwnershipInterestList' }
    post:
      operationId: createOwnershipInterest
      summary: Assign an effective ownership percentage
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipInterestCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/OwnershipInterestItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/rent/obligations:
    parameters: *identity
    get:
      operationId: listRentObligations
      summary: List lease-backed rent receivables with derived balances
      responses:
        '200': { $ref: '#/components/responses/RentObligationList' }
    post:
      operationId: createRentObligation
      summary: Generate one monthly obligation from an active lease
      description: Amount, currency, and due day are derived server-side from the lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RentObligationCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/RentObligationItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/rent/payments:
    parameters: *identity
    get:
      operationId: listRentPayments
      summary: List posted tenant payments and derived unallocated balances
      responses:
        '200': { $ref: '#/components/responses/RentPaymentList' }
    post:
      operationId: createRentPayment
      summary: Record an immutable posted payment
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RentPaymentCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/RentPaymentItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/rent/allocations:
    parameters: *identity
    post:
      operationId: createRentAllocation
      summary: Allocate a posted payment to an outstanding obligation
      description: The backend locks payment and obligation rows and rejects tenant, currency, or balance violations.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RentAllocationCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/RentAllocationItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  parameters:
    DevelopmentOrganization:
      name: X-Organization-ID
      in: header
      required: true
      description: Development-only organization identity. Production will use verified provider claims.
      schema: { type: string, format: uuid }
    DevelopmentUser:
      name: X-User-ID
      in: header
      required: true
      description: Development-only user identity. Membership and role are still verified server-side.
      schema: { type: string, format: uuid }
    PropertyID: { name: propertyID, in: path, required: true, schema: { type: string, format: uuid } }
    UnitID: { name: unitID, in: path, required: true, schema: { type: string, format: uuid } }
    TenantID: { name: tenantID, in: path, required: true, schema: { type: string, format: uuid } }
    TenancyID: { name: tenancyID, in: path, required: true, schema: { type: string, format: uuid } }
    LeaseID: { name: leaseID, in: path, required: true, schema: { type: string, format: uuid } }
    OwnerID: { name: ownerID, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    PropertyItem: { description: Property, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyEnvelope' } } } }
    PropertyList: { description: Properties, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyListEnvelope' } } } }
    UnitItem: { description: Unit, content: { application/json: { schema: { $ref: '#/components/schemas/UnitEnvelope' } } } }
    UnitList: { description: Units, content: { application/json: { schema: { $ref: '#/components/schemas/UnitListEnvelope' } } } }
    TenantItem: { description: Tenant, content: { application/json: { schema: { $ref: '#/components/schemas/TenantEnvelope' } } } }
    TenantList: { description: Tenants, content: { application/json: { schema: { $ref: '#/components/schemas/TenantListEnvelope' } } } }
    TenancyItem: { description: Tenancy, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyEnvelope' } } } }
    TenancyList: { description: Tenancies, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyListEnvelope' } } } }
    LeaseItem: { description: Lease, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseEnvelope' } } } }
    LeaseList: { description: Leases, content: { application/json: { schema: { $ref: '#/components/schemas/LeaseListEnvelope' } } } }
    OwnerItem: { description: Owner, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerEnvelope' } } } }
    OwnerList: { description: Owners, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerListEnvelope' } } } }
    OwnershipInterestItem: { description: Ownership interest, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipInterestEnvelope' } } } }
    OwnershipInterestList: { description: Ownership interests, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipInterestListEnvelope' } } } }
    RentObligationItem: { description: Rent obligation, content: { application/json: { schema: { $ref: '#/components/schemas/RentObligationEnvelope' } } } }
    RentObligationList: { description: Rent obligations, content: { application/json: { schema: { $ref: '#/components/schemas/RentObligationListEnvelope' } } } }
    RentPaymentItem: { description: Rent payment, content: { application/json: { schema: { $ref: '#/components/schemas/RentPaymentEnvelope' } } } }
    RentPaymentList: { description: Rent payments, content: { application/json: { schema: { $ref: '#/components/schemas/RentPaymentListEnvelope' } } } }
    RentAllocationItem: { description: Rent allocation, content: { application/json: { schema: { $ref: '#/components/schemas/RentAllocationEnvelope' } } } }
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ProblemEnvelope' } } } }
    Unauthorized: { description: Identity is missing, content: { application/json: { schema: { $ref: '#/components/schemas/ProblemEnvelope' } } } }
    Forbidden: { description: Membership or permission denied, content: { application/json: { schema: { $ref: '#/components/schemas/ProblemEnvelope' } } } }
    NotFound: { description: Resource not found in organization scope, content: { application/json: { schema: { $ref: '#/components/schemas/ProblemEnvelope' } } } }
    Conflict: { description: Lifecycle, ownership, uniqueness, or financial balance conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ProblemEnvelope' } } } }

  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, const: ok }
        service: { type: string }
        timestamp: { type: string, format: date-time }
    ApiInfo:
      type: object
      required: [name, version]
      properties: { name: { type: string }, version: { type: string } }
    ProblemEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }

    Property:
      type: object
      required: [id, organizationId, name, propertyType, addressLine1, city, countryCode, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        referenceCode: { type: string }
        name: { type: string }
        propertyType: { type: string, enum: [house, apartment, building, commercial, land, other] }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        countryCode: { type: string, minLength: 2, maxLength: 2 }
        status: { type: string, enum: [active, inactive, archived] }
        externalAvaraPropertyId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PropertyCreate:
      type: object
      required: [name, propertyType, addressLine1, city, countryCode]
      properties:
        referenceCode: { type: string }
        name: { type: string }
        propertyType: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        countryCode: { type: string }
        externalAvaraPropertyId: { type: string }
    PropertyUpdate:
      type: object
      properties:
        referenceCode: { type: string }
        name: { type: string }
        propertyType: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        countryCode: { type: string }
        status: { type: string }

    Unit:
      type: object
      required: [id, organizationId, propertyId, referenceCode, label, occupancyStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        referenceCode: { type: string }
        label: { type: string }
        bedrooms: { type: number }
        bathrooms: { type: number }
        floorArea: { type: number }
        floorAreaUnit: { type: string, enum: [sqft, sqm] }
        occupancyStatus: { type: string, enum: [vacant, occupied, reserved, unavailable] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UnitCreate:
      type: object
      required: [referenceCode, label]
      properties:
        referenceCode: { type: string }
        label: { type: string }
        bedrooms: { type: number }
        bathrooms: { type: number }
        floorArea: { type: number }
        floorAreaUnit: { type: string, enum: [sqft, sqm] }
        occupancyStatus: { type: string, enum: [vacant, occupied, reserved, unavailable] }
    UnitUpdate: { type: object, additionalProperties: true }

    Tenant:
      type: object
      required: [id, organizationId, legalName, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        legalName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [prospect, active, former, blocked] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TenantCreate:
      type: object
      required: [legalName]
      properties:
        legalName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [prospect, active, former, blocked], default: prospect }
    TenantUpdate: { type: object, additionalProperties: true }

    Tenancy:
      type: object
      required: [id, organizationId, unitId, unitLabel, propertyName, primaryTenantId, primaryTenantName, occupantCount, startDate, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        unitLabel: { type: string }
        propertyName: { type: string }
        primaryTenantId: { type: string, format: uuid }
        primaryTenantName: { type: string }
        occupantCount: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [upcoming, active, ended, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TenancyCreate:
      type: object
      required: [unitId, primaryTenantId, startDate]
      properties:
        unitId: { type: string, format: uuid }
        primaryTenantId: { type: string, format: uuid }
        occupantTenantIds: { type: array, items: { type: string, format: uuid } }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [upcoming, active, ended, cancelled], default: upcoming }
    TenancyUpdate: { type: object, additionalProperties: true }

    Lease:
      type: object
      required: [id, organizationId, tenancyId, referenceCode, propertyName, unitLabel, primaryTenantName, startDate, endDate, rentAmountMinor, depositAmountMinor, currency, dueDay, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        tenancyId: { type: string, format: uuid }
        referenceCode: { type: string }
        propertyName: { type: string }
        unitLabel: { type: string }
        primaryTenantName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        rentAmountMinor: { type: integer, format: int64, description: Monthly rent in currency minor units. }
        depositAmountMinor: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        status: { type: string, enum: [draft, active, expired, terminated, cancelled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeaseCreate:
      type: object
      required: [tenancyId, referenceCode, startDate, endDate, rentAmountMinor, currency, dueDay]
      properties:
        tenancyId: { type: string, format: uuid }
        referenceCode: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        rentAmountMinor: { type: integer, format: int64, minimum: 1 }
        depositAmountMinor: { type: integer, format: int64, minimum: 0, default: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        status: { type: string, enum: [draft, active], default: draft }
    LeaseUpdate:
      type: object
      properties: { status: { type: string, enum: [draft, active, expired, terminated, cancelled] } }

    Owner:
      type: object
      required: [id, organizationId, legalName, ownerType, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        legalName: { type: string }
        ownerType: { type: string, enum: [individual, company] }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OwnerCreate:
      type: object
      required: [legalName]
      properties:
        legalName: { type: string }
        ownerType: { type: string, enum: [individual, company], default: individual }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [active, inactive], default: active }

    OwnershipInterest:
      type: object
      required: [id, organizationId, propertyId, propertyName, ownerId, ownerName, ownershipBps, effectiveFrom, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyName: { type: string }
        ownerId: { type: string, format: uuid }
        ownerName: { type: string }
