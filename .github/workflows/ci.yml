name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: Go API + worker + MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - name: Format check
        working-directory: apps/api
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Go files require gofmt:"
            echo "$files"
            echo "Canonical formatting diff:"
            gofmt -d .
            exit 1
          fi
      - name: Resolve MCP module metadata for bootstrap
        working-directory: apps/api
        run: |
          go mod tidy
          echo '---BEGIN RESOLVED GO.MOD---'
          cat go.mod
          echo '---END RESOLVED GO.MOD---'
          echo '---BEGIN RESOLVED GO.SUM---'
          cat go.sum
          echo '---END RESOLVED GO.SUM---'
      - name: Test
        working-directory: apps/api
        run: go test ./...
      - name: Build API, worker and MCP
        working-directory: apps/api
        run: go build ./cmd/api ./cmd/worker ./cmd/mcp

  database:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: property_os
          POSTGRES_USER: property_os
          POSTGRES_PASSWORD: property_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U property_os -d property_os"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Apply migrations and seed
        env: { PGPASSWORD: property_os }
        run: |
          for migration in migrations/*_*.up.sql; do psql -h localhost -U property_os -d property_os -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -h localhost -U property_os -d property_os -v ON_ERROR_STOP=1 -f scripts/dev-seed.sql
          psql -h localhost -U property_os -d property_os -v ON_ERROR_STOP=1 -f scripts/dev-document-seed.sql
          psql -h localhost -U property_os -d property_os -v ON_ERROR_STOP=1 -f scripts/dev-notification-seed.sql
      - name: Verify identity mapping seed
        env: { PGPASSWORD: property_os }
        run: test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT user_id || ':' || subject FROM user_identities WHERE issuer = 'https://idp.example.invalid'")" = "22222222-2222-2222-2222-222222222222:property-os-dev-user"
      - name: Verify leasing seed
        env: { PGPASSWORD: property_os }
        run: |
          test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT count(*) FROM tenancies WHERE id='77777777-7777-7777-7777-777777777777' AND status='active'")" = "1"
          test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT count(*) FROM leases WHERE id='88888888-8888-8888-8888-888888888888' AND status='active'")" = "1"
      - name: Verify ownership and rent ledger seed
        env: { PGPASSWORD: property_os }
        run: |
          test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT ownership_bps FROM ownership_interests WHERE id='aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'")" = "10000"
          test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT ro.amount_minor-COALESCE(SUM(pa.amount_minor),0) FROM rent_obligations ro LEFT JOIN payment_allocations pa ON pa.obligation_id=ro.id AND pa.organization_id=ro.organization_id WHERE ro.id='bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb' GROUP BY ro.id,ro.amount_minor")" = "5000000"
      - name: Verify maintenance operations seed
        env: { PGPASSWORD: property_os }
        run: |
          test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT status FROM maintenance_requests WHERE id='ffffffff-ffff-ffff-ffff-ffffffffffff'")" = "resolved"
          test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT count(*) FROM maintenance_completion_evidence WHERE work_order_id='12121212-1212-1212-1212-121212121212'")" = "1"
      - name: Verify document metadata seed
        env: { PGPASSWORD: property_os }
        run: test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT resource_type || ':' || kind || ':' || status FROM documents WHERE id='15151515-1515-1515-1515-151515151515'")" = "lease:lease:available"
      - name: Verify notification outbox seed
        env: { PGPASSWORD: property_os }
        run: test "$(psql -h localhost -U property_os -d property_os -Atc "SELECT topic || ':' || channel || ':' || status FROM notification_outbox WHERE id='16161616-1616-1616-1616-161616161616'")" = "rent.reminder:email:pending"

  web:
    name: Next.js web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint:web
      - name: Build
        run: npm run build:web
