name: RevenueLeak OS pilot
on:
  push:
    paths:
      - 'experiments/revenueleak-os/**'
      - '.github/workflows/revenueleak-ci.yml'
  pull_request:
    paths:
      - 'experiments/revenueleak-os/**'
      - '.github/workflows/revenueleak-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/revenueleak-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: experiments/revenueleak-os/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server
      - name: Smoke test executable demo launcher
        run: |
          set -euo pipefail
          DATA_FILE="$RUNNER_TEMP/revenueleak-launcher-smoke.json" ./start-demo.sh &
          launcher_pid=$!
          trap 'kill "$launcher_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "Demo launcher did not become healthy"
          exit 1
